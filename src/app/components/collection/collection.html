@if(error.length>0){
<div class="alert alert-primary bg-primary text-white" role="alert">
    @for (err of error; track $index) {
    <small>{{err}}</small><br />
    }
</div>
}

<div class="fw-medium mb-2">
    Upload Image
</div>

@if(previewUrl()){
<img class="img-fluid mb-3" [src]="previewUrl()" #imgElement (load)="onImageLoad(imgElement.height)" />
}

<div class="mb-4">
    <input type="file" class="form-control" #imageTag (change)="imageTagChange($event)" accept=".jpg,.webp,.png">
</div>

<div class="fw-medium mb-2">
    Description
</div>

<div class="mb-4">
    <input type="text" class="form-control" placeholder="Image Description" [(ngModel)]="desc"
        [ngModelOptions]="{standalone: true}">
</div>

<div class="fw-medium mb-2">
    Identifier
</div>

<div class="mb-4">
    <input type="text" class="form-control" placeholder="Identifier" [(ngModel)]="identifier"
        [ngModelOptions]="{standalone: true}" [disabled]="editMode()">
</div>

<div class="fw-medium mb-2">
    Location
</div>

<div class="mb-4">
    <input type="text" class="form-control" placeholder="Location" [(ngModel)]="location"
        [ngModelOptions]="{standalone: true}">
</div>

<div class="fw-medium mb-2">
    Alt Text
</div>

<div class="mb-4">
    <input type="text" class="form-control" placeholder="Alt Text" [(ngModel)]="alternate_text"
        [ngModelOptions]="{standalone: true}">
</div>

<div class="fw-medium mb-2">
    Priority
</div>

<select class="form-select mb-4" aria-label="Small select example" [(ngModel)]="priority"
    [ngModelOptions]="{standalone: true}">
    @for (item of image_list(); let i = $index; track i) {
    <option [value]="i+1">{{i+1}}</option>
    }
</select>

<div class="text-end mb-4">
    @if(ongoing()){
    <button class="btn btn-outline-light px-5" disabled>
        <div class="spinner-border spinner-border-sm" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </button>
    }
    @else {
    <button class="btn btn-outline-light me-2" (click)="reset()">Reset</button>
    <button class="btn btn-outline-light" (click)="uploadToCollection()">
        @if(editMode()){
        Edit
        }
        @else {
        Add to collection
        }
    </button>
    }
</div>


<div class="row g-2 mb-1">
    <div class="col-6">
        @for (item of left(); track $index) {
        <img [src]="item.url" class="img-fluid rounded-3 mb-2 glideUp" loading="lazy" />
        <div class="d-flex gap-2 mb-2">
            <select class="form-select form-select-sm" aria-label="Small select example" [(ngModel)]="item.priority"
                [ngModelOptions]="{standalone: true}" [disabled]="!stateService.loggedIn() || holdEdit()"
                (change)="updatePriority(item)">
                @for (item of collection_list(); let i = $index; track i) {
                <option [value]="i+1">{{i+1}}</option>
                }
            </select>
            <button class="btn btn-outline-light btn-sm" (click)="selectEditable(item)" [disabled]="!stateService.loggedIn() || holdEdit()">Edit</button>
        </div>
        }
    </div>

    <div class="col-6">
        @for (item of right(); track $index) {
        <img [src]="item.url" class="img-fluid rounded-3 mb-2 glideUp" loading="lazy" />
        <div class="d-flex gap-2 mb-2">
            <select class="form-select form-select-sm" aria-label="Small select example" [(ngModel)]="item.priority"
                [ngModelOptions]="{standalone: true}" [disabled]="!stateService.loggedIn() || holdEdit()"
                (change)="updatePriority(item)">
                @for (item of collection_list(); let i = $index; track i) {
                <option [value]="i+1">{{i+1}}</option>
                }
            </select>
            <button class="btn btn-outline-light btn-sm" (click)="selectEditable(item)" [disabled]="!stateService.loggedIn() || holdEdit()">Edit</button>
        </div>
        }
    </div>
</div>
